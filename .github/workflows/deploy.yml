      - name: Check Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL set: ${SUPABASE_URL:+yes}"
          echo "SUPABASE_ANON_KEY set: ${SUPABASE_ANON_KEY:+yes}"

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing Supabase secrets" >&2
            exit 1
          fi

          # Remove accidental line breaks from copied secret
          SUPABASE_URL="$(printf '%s' "${SUPABASE_URL}" | tr -d '\r\n')"

          echo "URL length: ${#SUPABASE_URL}"

          case "${SUPABASE_URL}" in
            https://*.supabase.co)
              echo "Supabase URL format looks correct."
              ;;
            *)
              echo "ERROR: SUPABASE_URL does not look like a Supabase project URL."
              exit 1
              ;;
          esac

          echo "Checking Supabase connection..."

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/posts?select=slug&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase response status: ${STATUS}"

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "Supabase connection check failed" >&2
            exit 1
          fi

          echo "Supabase connection successful."
