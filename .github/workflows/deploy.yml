name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL set: ${SUPABASE_URL:+yes}"
          echo "SUPABASE_ANON_KEY set: ${SUPABASE_ANON_KEY:+yes}"

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing Supabase secrets" >&2
            exit 1
          fi

          echo "Checking Supabase connection..."

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/posts?select=slug&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase response status: ${STATUS}"

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "Supabase connection check failed" >&2
            exit 1
          fi

          echo "Supabase connection successful."

      - name: Build static site
        env:
          STATIC_BUILD: "1"
          SITE_URL: "https://streamandscream.com"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: bun run build:static

      - name: Check built website
        run: |
          echo "Checking dist/client..."

          if [ ! -d "dist/client" ]; then
            echo "ERROR: dist/client does not exist"
            exit 1
          fi

          echo "Files found:"
          find dist/client -maxdepth 2 -type f | sort | head -100

          if [ ! -f "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html does not exist"
            exit 1
          fi

          if [ ! -s "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html is empty"
            exit 1
          fi

          if cmp -s dist/client/index.html dist/client/spa.html; then
            echo "ERROR: dist/client/index.html is the SPA shell, not the prerendered homepage"
            exit 1
          fi

          if ! grep -q "Stream" dist/client/index.html; then
            echo "ERROR: dist/client/index.html does not look like the Stream & Scream homepage"
            exit 1
          fi

          INDEX_PATH="$(realpath dist/client/index.html)"
          INDEX_SIZE="$(wc -c < dist/client/index.html | tr -d ' ')"
          echo "Homepage ready for FTP deployment:"
          echo "  absolute local path: ${INDEX_PATH}"
          echo "  file size: ${INDEX_SIZE} bytes"
          echo "  FTP mapping: ${INDEX_PATH} -> /index.html (FTP account root)"

          for required in dist/client/.htaccess dist/client/assets dist/client/sitemap.xml; do
            if [ ! -e "$required" ]; then
              echo "ERROR: missing $required"
              exit 1
            fi
          done

          echo "SUCCESS: dist/client/index.html is the real homepage ($(wc -c < dist/client/index.html) bytes)"


      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/client/
          # The Hostinger FTP account itself must be rooted at public_html.
          # Using / here prevents public_html/public_html nesting.
          server-dir: /
          dangerous-clean-slate: true
          log-level: verbose

      - name: Verify Hostinger web-root target
        env:
          SITE_URL: https://streamandscream.com
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Configured FTP server-dir: /"
          echo "Expected Hostinger FTP account root: public_html"
          echo "Confirmed deployment mapping: dist/client/index.html -> /index.html"
          echo "Therefore, with the FTP account rooted at public_html: /index.html -> public_html/index.html"

          mkdir -p /tmp/hostinger-deploy-check
          curl --fail --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_SERVER}/index.html" \
            --output /tmp/hostinger-deploy-check/index.html

          LOCAL_HASH="$(sha256sum dist/client/index.html | cut -d ' ' -f 1)"
          REMOTE_HASH="$(sha256sum /tmp/hostinger-deploy-check/index.html | cut -d ' ' -f 1)"
          REMOTE_SIZE="$(wc -c < /tmp/hostinger-deploy-check/index.html | tr -d ' ')"

          if [ "${LOCAL_HASH}" != "${REMOTE_HASH}" ]; then
            echo "ERROR: FTP /index.html does not match dist/client/index.html." >&2
            echo "The FTP account is not rooted at the intended public_html directory." >&2
            exit 1
          fi

          echo "SUCCESS: FTP /index.html exactly matches dist/client/index.html (${REMOTE_SIZE} bytes)."
          echo "With this Hostinger FTP account rooted at public_html, the verified remote file is public_html/index.html."

          LIVE_HOME="$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL}/?deploy-check=${GITHUB_RUN_ID}")"
          if ! printf '%s' "${LIVE_HOME}" | grep -q "Stream"; then
            echo "ERROR: ${SITE_URL}/ does not contain the expected homepage after deployment." >&2
            echo "Check that FTP_USERNAME is configured in Hostinger with its directory set exactly to public_html." >&2
            exit 1
          fi

          echo "SUCCESS: ${SITE_URL}/ is serving the Stream & Scream homepage from the configured Hostinger web root."

