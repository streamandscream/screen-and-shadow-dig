name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two uploads write to public_html at the same time. A newer push
# waits for the active deployment instead of cancelling it halfway through.
concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Which directory on the FTP server is the live web root depends on the
      # Hostinger account used:
      #   - dedicated FTP account (u467883492.streamnscream22) -> scoped to
      #     public_html, so the web root is "/"
      #   - main account (u467883492) -> logs into the home dir, so the web
      #     root is /domains/streamandscream.com/public_html/
      # FTP_REMOTE_DIR is required so changing FTP accounts can never silently
      # send a successful deployment outside the domain's document root.
      DEPLOY_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      REMOTE_INDEX: ${{ secrets.FTP_REMOTE_DIR }}index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL set: ${SUPABASE_URL:+yes}"
          echo "SUPABASE_ANON_KEY set: ${SUPABASE_ANON_KEY:+yes}"

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing Supabase secrets" >&2
            exit 1
          fi

          echo "Checking Supabase connection..."

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/posts?select=slug&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase response status: ${STATUS}"

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "Supabase connection check failed" >&2
            exit 1
          fi

          echo "Supabase connection successful."

      - name: Build static site
        env:
          STATIC_BUILD: "1"
          SITE_URL: "https://streamandscream.com"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: bun run build:static

      - name: Check built website
        run: |
          echo "Checking dist/client..."
          echo "Running required homepage diagnostics:"

          test -f dist/client/index.html
          wc -c dist/client/index.html
          ls -lah dist/client/index.html
          head -20 dist/client/index.html

          if [ ! -d "dist/client" ]; then
            echo "ERROR: dist/client does not exist"
            exit 1
          fi

          echo "Files found:"
          find dist/client -maxdepth 2 -type f | sort | head -100

          if [ ! -f "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html does not exist"
            exit 1
          fi

          if [ ! -s "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html is empty"
            exit 1
          fi

          if cmp -s dist/client/index.html dist/client/spa.html; then
            echo "ERROR: dist/client/index.html is the SPA shell, not the prerendered homepage"
            exit 1
          fi

          if ! grep -q "Stream" dist/client/index.html; then
            echo "ERROR: dist/client/index.html does not look like the Stream & Scream homepage"
            exit 1
          fi

          INDEX_PATH="$(realpath dist/client/index.html)"
          INDEX_SIZE="$(wc -c < dist/client/index.html | tr -d ' ')"
          echo "Root contents that will be sent to FTP:"
          ls -lah dist/client/
          echo "DEPLOYING HOMEPAGE:"
          echo "dist/client/index.html -> FTP ROOT/index.html"
          echo "Homepage ready for FTP deployment:"
          echo "  absolute local path: ${INDEX_PATH}"
          echo "  file size: ${INDEX_SIZE} bytes"
          echo "  FTP mapping: ${INDEX_PATH} -> /index.html (FTP account root)"

          for required in dist/client/.htaccess dist/client/assets dist/client/sitemap.xml; do
            if [ ! -e "$required" ]; then
              echo "ERROR: missing $required"
              exit 1
            fi
          done

          echo "SUCCESS: dist/client/index.html is the real homepage ($(wc -c < dist/client/index.html) bytes)"

      - name: Confirm FTP deployment target
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_DIR}" ]; then
            echo "ERROR: FTP_REMOTE_DIR is required." >&2
            echo "Use / for a domain-scoped FTP account, or /domains/streamandscream.com/public_html/ for the main Hostinger account." >&2
            exit 1
          fi
          case "${DEPLOY_DIR}" in
            */) ;;
            *)
              echo "ERROR: FTP_REMOTE_DIR must end with a slash (for example /domains/streamandscream.com/public_html/)." >&2
              exit 1
              ;;
          esac
          echo "Hostinger FTP account root: public_html"
          echo "Deploy directory: ${DEPLOY_DIR}"
          echo "DEPLOYING HOMEPAGE:"
          echo "dist/client/index.html -> FTP ROOT/index.html"

      # Upload supporting files first and the homepage last. The existing
      # index.html remains live throughout the transfer, so an interrupted
      # upload cannot leave Apache without a directory index.
      - name: Upload website files via FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Drop the stale sync state so nothing is treated as "already uploaded"
          rm -f dist/client/.ftp-deploy-sync-state.json
          # Shared-hosting FTP servers commonly throttle or drop parallel data
          # connections. Use one transfer at a time and retry the whole mirror
          # so a temporary Hostinger timeout cannot leave the deployment stuck.
          upload_attempt=1
          until lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set ftp:sync-mode false;
            set net:timeout 60;
            set net:max-retries 8;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set mirror:parallel-transfer-count 1;
            open -u '${FTP_USERNAME}','${FTP_PASSWORD}' -p 21 '${FTP_SERVER}';
            rm -f '${DEPLOY_DIR}.ftp-deploy-sync-state.json' || true;
            mirror --reverse --continue --ignore-time --verbose=1 \
              --exclude-glob index.html \
              --exclude-glob .htaccess \
              --exclude-glob .ftp-deploy-sync-state.json \
              dist/client/ '${DEPLOY_DIR}';
            bye;
          "; do
            if [ "${upload_attempt}" -ge 3 ]; then
              echo "ERROR: Hostinger FTP upload failed after ${upload_attempt} attempts." >&2
              exit 1
            fi
            echo "FTP upload attempt ${upload_attempt} failed; reconnecting in 15 seconds..."
            upload_attempt=$((upload_attempt + 1))
            sleep 15
          done

      - name: Activate the new website
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Upload and rename in one FTP session. curl and lftp interpret FTP
          # paths differently on chrooted Hostinger accounts, which previously
          # put the temporary files somewhere the rename step could not see.
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 8;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            open -u '${FTP_USERNAME}','${FTP_PASSWORD}' -p 21 '${FTP_SERVER}';
            cd '${DEPLOY_DIR}';
            put -c 'dist/client/.htaccess' -o '.htaccess.new';
            put -c 'dist/client/index.html' -o 'index.html.new';
            mv '.htaccess.new' '.htaccess';
            chmod 644 '.htaccess';
            mv 'index.html.new' 'index.html';
            chmod 644 'index.html';
            bye;
          "

          echo "Activated ${REMOTE_INDEX} after all supporting files completed."

      - name: Verify Hostinger web-root target
        shell: bash
        env:
          SITE_URL: https://streamandscream.com
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          LOCAL_FILE="dist/client/index.html"
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "${CHECK_DIR}"' EXIT

          if [ ! -f "${LOCAL_FILE}" ]; then
            echo "ERROR: Local homepage artifact is missing: ${LOCAL_FILE}" >&2
            echo "Confirm the static build completed and wrote dist/client/index.html before FTP deployment." >&2
            exit 1
          fi

          if [ ! -s "${LOCAL_FILE}" ]; then
            echo "ERROR: Local homepage artifact is empty: ${LOCAL_FILE}" >&2
            exit 1
          fi

          echo "Local homepage: $(realpath "${LOCAL_FILE}") ($(wc -c < "${LOCAL_FILE}" | tr -d ' ') bytes)"

          # Remove carriage returns before hashing so CRLF/LF differences do not
          # make otherwise identical HTML files appear different.
          tr -d '\r' < "${LOCAL_FILE}" > "${CHECK_DIR}/local.normalized.html"
          LOCAL_HASH="$(sha256sum "${CHECK_DIR}/local.normalized.html" | awk '{print $1}')"
          echo "Local normalized SHA256: ${LOCAL_HASH}"

          fetch_ftp_file() {
            local remote_path="$1"
            local output_file="$2"

            curl \
              --fail \
              --silent \
              --show-error \
              --ftp-pasv \
              --ssl-reqd \
              -k \
              --connect-timeout 20 \
              --max-time 120 \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              --output "${output_file}" \
              "ftp://${FTP_SERVER}${remote_path}"
          }

          echo "Checking deployed path: ${REMOTE_INDEX}"
          if fetch_ftp_file "${REMOTE_INDEX}" "${CHECK_DIR}/remote-index.html"; then
            tr -d '\r' < "${CHECK_DIR}/remote-index.html" > "${CHECK_DIR}/remote-index.normalized.html"
            REMOTE_HASH="$(sha256sum "${CHECK_DIR}/remote-index.normalized.html" | awk '{print $1}')"
            echo "FTP ${REMOTE_INDEX} normalized SHA256: ${REMOTE_HASH}"
            if [ "${REMOTE_HASH}" = "${LOCAL_HASH}" ]; then
              echo "SUCCESS: The deployed artifact matches FTP ${REMOTE_INDEX}."
            else
              echo "ERROR: ${REMOTE_INDEX} exists but does not match the local build." >&2
              echo "Check whether Hostinger serves a different directory, or a cached/older index.html was left behind." >&2
              exit 1
            fi
          else
            echo "ERROR: Could not fetch ${REMOTE_INDEX} from FTP after deployment." >&2
            echo "Inspect the FTP account directory setting and the upload log line for index.html." >&2
            exit 1
          fi


          echo "Checking live homepage: ${SITE_URL}/"
          LIVE_FILE="${CHECK_DIR}/live-homepage.html"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            --output "${LIVE_FILE}" \
            "${SITE_URL%/}/?deploy-check=${GITHUB_RUN_ID}"

          if ! grep -Fq "Stream" "${LIVE_FILE}"; then
            echo "ERROR: The live homepage responded, but it does not contain the expected text: Stream" >&2
            echo "Inspect Hostinger's domain document root, cache/CDN settings, and public_html/index.html." >&2
            exit 1
          fi

          echo "SUCCESS: ${SITE_URL%/}/ serves the expected Stream & Scream homepage."

      - name: Verify assets and a post page are live
        shell: bash
        env:
          SITE_URL: https://streamandscream.com
        run: |
          set -euo pipefail
          ASSET="$(grep -o '/assets/[A-Za-z0-9._-]*\.css' dist/client/index.html | head -1)"
          echo "Checking asset: ${ASSET}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}${ASSET}")
          echo "asset status: ${code}"
          [ "${code}" = "200" ] || { echo "ERROR: built assets are missing on the server — the upload was incomplete." >&2; exit 1; }
          for p in /spa.html /sitemap.xml; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}${p}")
            echo "${p} -> ${c}"
            [ "${c}" = "200" ] || { echo "ERROR: ${p} missing on the server." >&2; exit 1; }
          done
