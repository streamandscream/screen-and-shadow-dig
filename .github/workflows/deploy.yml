name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL set: ${SUPABASE_URL:+yes}"
          echo "SUPABASE_ANON_KEY set: ${SUPABASE_ANON_KEY:+yes}"

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing Supabase secrets" >&2
            exit 1
          fi

          echo "Checking Supabase connection..."

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/posts?select=slug&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase response status: ${STATUS}"

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "Supabase connection check failed" >&2
            exit 1
          fi

          echo "Supabase connection successful."

      - name: Build static site
        env:
          STATIC_BUILD: "1"
          SITE_URL: "https://streamandscream.com"
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: bun run build:static

      - name: Check built website
        run: |
          echo "Checking dist/client..."
          echo "Running required homepage diagnostics:"

          test -f dist/client/index.html
          wc -c dist/client/index.html
          ls -lah dist/client/index.html
          head -20 dist/client/index.html

          if [ ! -d "dist/client" ]; then
            echo "ERROR: dist/client does not exist"
            exit 1
          fi

          echo "Files found:"
          find dist/client -maxdepth 2 -type f | sort | head -100

          if [ ! -f "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html does not exist"
            exit 1
          fi

          if [ ! -s "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html is empty"
            exit 1
          fi

          if cmp -s dist/client/index.html dist/client/spa.html; then
            echo "ERROR: dist/client/index.html is the SPA shell, not the prerendered homepage"
            exit 1
          fi

          if ! grep -q "Stream" dist/client/index.html; then
            echo "ERROR: dist/client/index.html does not look like the Stream & Scream homepage"
            exit 1
          fi

          INDEX_PATH="$(realpath dist/client/index.html)"
          INDEX_SIZE="$(wc -c < dist/client/index.html | tr -d ' ')"
          echo "Root contents that will be sent to FTP:"
          ls -lah dist/client/
          echo "DEPLOYING HOMEPAGE:"
          echo "dist/client/index.html -> FTP ROOT/index.html"
          echo "Homepage ready for FTP deployment:"
          echo "  absolute local path: ${INDEX_PATH}"
          echo "  file size: ${INDEX_SIZE} bytes"
          echo "  FTP mapping: ${INDEX_PATH} -> /index.html (FTP account root)"

          for required in dist/client/.htaccess dist/client/assets dist/client/sitemap.xml; do
            if [ ! -e "$required" ]; then
              echo "ERROR: missing $required"
              exit 1
            fi
          done

          echo "SUCCESS: dist/client/index.html is the real homepage ($(wc -c < dist/client/index.html) bytes)"

      - name: Confirm FTP account is rooted at public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --list-only \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_SERVER}/" \
            --output /tmp/ftp-root-listing.txt

          if grep -qx "public_html" /tmp/ftp-root-listing.txt; then
            echo "ERROR: This FTP login can see a public_html directory, so its root is above the public web root." >&2
            echo "Create or edit the Hostinger FTP account so its directory is public_html, then update FTP_USERNAME and FTP_PASSWORD." >&2
            echo "Deployment stopped before dangerous-clean-slate could remove files from the wrong directory." >&2
            exit 1
          fi

          echo "FTP preflight passed: no nested public_html directory is visible."
          echo "The FTP account must be configured in Hostinger with public_html as its root directory."

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/client/
          # The Hostinger FTP account itself must be rooted at public_html.
          # Using / here prevents public_html/public_html nesting.
          server-dir: /
          dangerous-clean-slate: true
          log-level: verbose

      # FTP-Deploy-Action tracks files in .ftp-deploy-sync-state.json. If a
      # remote file is removed outside the action, that state can incorrectly
      # report index.html as unchanged and omit its STOR line. Upload the
      # verified homepage explicitly so the log and remote result are
      # deterministic on every run.
      - name: Force upload homepage to FTP root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo 'uploading "index.html"'
          echo "dist/client/index.html -> FTP ROOT/index.html"
          curl --fail --silent --show-error \
            --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file dist/client/index.html \
            "ftp://${FTP_SERVER}/index.html"

      - name: Verify Hostinger web-root target
        shell: bash
        env:
          SITE_URL: https://streamandscream.com
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          LOCAL_FILE="dist/client/index.html"
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "${CHECK_DIR}"' EXIT

          if [ ! -f "${LOCAL_FILE}" ]; then
            echo "ERROR: Local homepage artifact is missing: ${LOCAL_FILE}" >&2
            echo "Confirm the static build completed and wrote dist/client/index.html before FTP deployment." >&2
            exit 1
          fi

          if [ ! -s "${LOCAL_FILE}" ]; then
            echo "ERROR: Local homepage artifact is empty: ${LOCAL_FILE}" >&2
            exit 1
          fi

          echo "Local homepage: $(realpath "${LOCAL_FILE}") ($(wc -c < "${LOCAL_FILE}" | tr -d ' ') bytes)"

          # Remove carriage returns before hashing so CRLF/LF differences do not
          # make otherwise identical HTML files appear different.
          tr -d '\r' < "${LOCAL_FILE}" > "${CHECK_DIR}/local.normalized.html"
          LOCAL_HASH="$(sha256sum "${CHECK_DIR}/local.normalized.html" | awk '{print $1}')"
          echo "Local normalized SHA256: ${LOCAL_HASH}"

          fetch_ftp_file() {
            local remote_path="$1"
            local output_file="$2"

            curl \
              --fail \
              --silent \
              --show-error \
              --ftp-pasv \
              --connect-timeout 15 \
              --max-time 60 \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              --output "${output_file}" \
              "ftp://${FTP_SERVER}${remote_path}"
          }

          ROOT_FETCHED=false
          NESTED_FETCHED=false
          ROOT_MATCH=false
          NESTED_MATCH=false

          echo "Checking FTP root path: /index.html"
          if fetch_ftp_file "/index.html" "${CHECK_DIR}/root-index.html"; then
            ROOT_FETCHED=true
            tr -d '\r' < "${CHECK_DIR}/root-index.html" > "${CHECK_DIR}/root-index.normalized.html"
            ROOT_HASH="$(sha256sum "${CHECK_DIR}/root-index.normalized.html" | awk '{print $1}')"
            echo "FTP /index.html normalized SHA256: ${ROOT_HASH}"
            if [ "${ROOT_HASH}" = "${LOCAL_HASH}" ]; then
              ROOT_MATCH=true
            fi
          else
            echo "FTP /index.html was not available. Checking whether the account root is above public_html."
          fi

          echo "Checking explicit Hostinger path: /public_html/index.html"
          if fetch_ftp_file "/public_html/index.html" "${CHECK_DIR}/nested-index.html"; then
            NESTED_FETCHED=true
            tr -d '\r' < "${CHECK_DIR}/nested-index.html" > "${CHECK_DIR}/nested-index.normalized.html"
            NESTED_HASH="$(sha256sum "${CHECK_DIR}/nested-index.normalized.html" | awk '{print $1}')"
            echo "FTP /public_html/index.html normalized SHA256: ${NESTED_HASH}"
            if [ "${NESTED_HASH}" = "${LOCAL_HASH}" ]; then
              NESTED_MATCH=true
            fi
          else
            echo "FTP /public_html/index.html was not available (expected when this FTP account is already rooted at public_html)."
          fi

          if [ "${ROOT_MATCH}" = true ]; then
            echo "SUCCESS: The deployed artifact matches FTP /index.html."
            echo "MATCHED REMOTE PATH: /index.html"
            echo "This is the correct result for an FTP account rooted directly at public_html."
          elif [ "${NESTED_MATCH}" = true ]; then
            echo "ERROR: The artifact matched /public_html/index.html, not /index.html." >&2
            echo "The FTP account is rooted above public_html. In Hostinger, set this FTP account's directory to the site's public_html folder, then keep server-dir: /." >&2
            exit 1
          else
            echo "ERROR: No checked remote file matches ${LOCAL_FILE}." >&2
            echo "FTP /index.html fetched: ${ROOT_FETCHED}; matching hash: ${ROOT_MATCH}" >&2
            echo "FTP /public_html/index.html fetched: ${NESTED_FETCHED}; matching hash: ${NESTED_MATCH}" >&2
            echo "Inspect the FTP account directory, the workflow server-dir, and the upload log line for index.html." >&2
            exit 1
          fi

          echo "Checking live homepage: ${SITE_URL}/"
          LIVE_FILE="${CHECK_DIR}/live-homepage.html"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            --output "${LIVE_FILE}" \
            "${SITE_URL%/}/?deploy-check=${GITHUB_RUN_ID}"

          if ! grep -Fq "Stream" "${LIVE_FILE}"; then
            echo "ERROR: The live homepage responded, but it does not contain the expected text: Stream" >&2
            echo "Inspect Hostinger's domain document root, cache/CDN settings, and public_html/index.html." >&2
            exit 1
          fi

          echo "SUCCESS: ${SITE_URL%/}/ serves the expected Stream & Scream homepage."

