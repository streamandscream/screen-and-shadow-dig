- name: Check Supabase connection
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  run: |
    echo "SUPABASE_URL set: ${SUPABASE_URL:+yes}"
    echo "SUPABASE_ANON_KEY set: ${SUPABASE_ANON_KEY:+yes}"
    echo "Supabase URL: ${SUPABASE_URL}"

    curl -v \
      "${SUPABASE_URL}/rest/v1/posts?select=slug&limit=1" \
      -H "apikey: ${SUPABASE_ANON_KEY}" \
      -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
    fi

    echo "Supabase response status: ${STATUS}"

    if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
      echo "Supabase connection check failed" >&2
      exit 1
    fi

    echo "Supabase connection successful."

      
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/client/
          server-dir: /public_html/
          dangerous-clean-slate: false
